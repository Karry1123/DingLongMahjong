name: Build Android APK and publish release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Design-system color lint
        run: npm run lint:colors

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build mobile web bundle
        run: npm run build:mobile
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dinglongmahjong.onrender.com' }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: frontend/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          OUT="$RUNNER_TEMP/DingLongMahjong-${{ steps.version.outputs.tag }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Package web bundle and update manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          (cd dist-mobile && zip -qr "$RUNNER_TEMP/DingLongMahjong-$TAG-web.zip" .)
          node --input-type=module <<'NODE'
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { TAG, RUNNER_TEMP, GITHUB_REPOSITORY, APK_PATH } = process.env;
          const base = `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DingLongMahjong-${TAG}`;
          const manifest = {
            version: TAG,
            nativeBuild: JSON.parse(readFileSync('native-version.json', 'utf8')).nativeBuild,
            bundleUrl: `${base}-web.zip`,
            bundleSha256: createHash('sha256').update(readFileSync(`${RUNNER_TEMP}/DingLongMahjong-${TAG}-web.zip`)).digest('hex'),
            apkUrl: `${base}.apk`,
            apkSize: statSync(APK_PATH).size,
          };
          writeFileSync(`${RUNNER_TEMP}/DingLongMahjong-${TAG}-update.json`, JSON.stringify(manifest, null, 2));
          NODE

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DingLongMahjong-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ runner.temp }}/DingLongMahjong-${{ steps.version.outputs.tag }}-web.zip
            ${{ runner.temp }}/DingLongMahjong-${{ steps.version.outputs.tag }}-update.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="../docs/releases/$TAG.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing APK asset"
          else
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
            fi
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/DingLongMahjong-$TAG-web.zip" "$RUNNER_TEMP/DingLongMahjong-$TAG-update.json" --repo "$GITHUB_REPOSITORY" --clobber
